name: Links

on:
  schedule:
    - cron: '17 5 * * 1'      # weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in all Markdown files
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: false
          jobSummary: true
          output: lychee-report.md

      - name: Open or update an issue when links are broken
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create link-check --color D93F0B --description "Automated link check findings" --force
          existing="$(gh issue list --label link-check --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file lychee-report.md
          else
            gh issue create --title "Broken links found by the weekly check" --label link-check --body-file lychee-report.md
          fi
