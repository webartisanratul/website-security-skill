name: Quarterly review reminder

on:
  schedule:
    - cron: '0 6 1 1,4,7,10 *'   # 06:00 UTC on 1 Jan, Apr, Jul, Oct
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create maintenance --color 0E8A16 --description "Scheduled maintenance" --force
          quarter="$(( ($(date -u +%-m) - 1) / 3 + 1 ))"
          title="Quarterly content review due: $(date -u +%Y)-Q${quarter}"
          existing="$(gh issue list --label maintenance --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --label maintenance --body-file .github/REVIEW_ISSUE.md
          fi
